name: Daily public-site QA
on:
  # Check code changes automatically, but never retrigger on reports/* commits.
  push:
    branches: [main]
    paths:
      - 'monitor/**'
      - 'tests/**'
      - '.github/workflows/daily-audit.yml'
      - 'requirements.txt'
  workflow_dispatch:
  schedule:
    # 18:00 Ufa (UTC+05:00), every day. GitHub may start scheduled jobs later.
    - cron: '17 13 * * *' # Primary: 18:17 Ufa; avoid top-of-hour congestion
    - cron: '17 16 * * *' # Fallback: 21:17 Ufa; skip if today's report exists
permissions:
  contents: write # Write only sanitized reports through GITHUB_TOKEN; no PAT/API keys.
concurrency:
  group: spk-effa-public-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check whether today's report is already saved
        id: fresh
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, json, os, pathlib
          today = dt.datetime.now(dt.timezone(dt.timedelta(hours=5))).date().isoformat()
          try:
              report = json.loads(pathlib.Path("reports/latest.json").read_text(encoding="utf-8"))
              done = report.get("date_ufa") == today
          except (OSError, ValueError):
              done = False
          # Push and manual dispatch always validate the changed monitor.
          skip = os.environ.get("GITHUB_EVENT_NAME") == "schedule" and done
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"skip={'true' if skip else 'false'}\\n".replace("\\\\n", "\\n"))
          print(f"Ufa date={today}; existing report today={done}; skip={skip}")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        if: steps.fresh.outputs.skip != 'true'
      - run: pip install -r requirements.txt
        if: steps.fresh.outputs.skip != 'true'
      - run: python -m playwright install --with-deps chromium
        if: steps.fresh.outputs.skip != 'true'
      - name: Run read-only audit
        if: steps.fresh.outputs.skip != 'true'
        run: python -m monitor.audit
      - name: Validate report format
        if: steps.fresh.outputs.skip != 'true'
        run: python -m pytest -q
      - name: Save public sanitized reports
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest.json reports/latest.md reports/history/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: daily public QA report'
            git push
          fi